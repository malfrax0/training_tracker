name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

env:
  DOCKER_IMAGE: malfrax/workout_tracker

jobs:
  # ───────────────────────────── TypeScript Lint ───────────────────────────
  lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # reads packageManager field from root package.json → pnpm@10.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ───────────────────────────── Cypress E2E Tests ─────────────────────────
  test-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # E2E tests run against the full Docker stack (app + postgres) on port 80.
      # Auth0 vars must be present before the build so Vite can bake them in.
      - name: Create .env for Docker Compose
        run: |
          echo "VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}" >> .env
          echo "VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}" >> .env
          echo "VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE }}" >> .env
          echo "AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }}" >> .env
          echo "AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=training_tracker" >> .env
          echo "APP_PORT=80" >> .env

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Wait for app to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost/health; do sleep 3; done'

      # Dump logs if the health check (or anything above) fails — makes backend
      # crash reasons visible without having to ssh into the runner.
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Run database migrations
        run: docker compose exec -T app node /app/backend/dist/migrations/migrate.js

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cypress npm package is installed above but the binary must be fetched separately
      - name: Install Cypress binary
        run: npx cypress install

      - name: Run Cypress E2E tests
        run: pnpm e2e:run
        env:
          # These are read by cypress.config.ts setupNodeEvents()
          CYPRESS_AUTH0_USERNAME: ${{ vars.CYPRESS_AUTH0_USERNAME }}
          CYPRESS_AUTH0_PASSWORD: ${{ secrets.CYPRESS_AUTH0_PASSWORD }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/e2e/cypress/screenshots

  # ───────────────────────────── Docker Build & Push ───────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test-e2e]
    # Only build+push on main or branches containing "deploy" (skip PRs)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || contains(github.ref, 'deploy'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for version calculation

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Version tag for main (conventional commits) ──
      - name: Calculate next version (main only)
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          # Get the latest version tag, default to v0.0.0 if none
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"

          # Parse semver
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Analyze commits since last tag to determine bump type
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "${LATEST_TAG}..HEAD")
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?!:|^BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump type: $BUMP"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # ── Branch tag for deploy branches ──
      - name: Calculate branch tag
        if: github.ref != 'refs/heads/main'
        id: branch_tag
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          # Sanitize: replace / and special chars with -
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ── Build & push for main ──
      # VITE_AUTH0_* vars are build args — Vite bakes them into the JS bundle.
      # AUTH0_DOMAIN / AUTH0_AUDIENCE are runtime env vars injected at container start.
      - name: Build and push (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.new_version }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & push for deploy branches ──
      - name: Build and push (branch)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.branch_tag.outputs.tag }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Create git tag for main releases ──
      - name: Create Git tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_version }}"
          git push origin "${{ steps.version.outputs.new_version }}"
